name: Deploy Planner

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Gist token and build
        run: |
          mkdir _site
          sed "s|%%GIST_TOKEN%%|${{ secrets.GIST_TOKEN }}|g" index.html > _site/index.html
          # Verify replacement worked (safe — only prints true/false, not the token)
          grep -q "%%GIST_TOKEN%%" _site/index.html && echo "REPLACEMENT FAILED" || echo "Replacement OK"

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
