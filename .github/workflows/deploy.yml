name: Deploy Planner

on:
  push:
    branches: [main]

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Gist token into HTML
        # Replaces the %%GIST_TOKEN%% placeholder with the real secret.
        # The secret is never written to disk or printed in logs.
        run: |
          sed -i "s|%%GIST_TOKEN%%|${{ secrets.GIST_TOKEN }}|g" index.html

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # upload the whole repo root (just index.html is fine)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
