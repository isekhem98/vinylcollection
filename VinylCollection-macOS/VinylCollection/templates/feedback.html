<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback - Vinyl Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
body {
  --bg: #0a0806; --chrome: #110e09; --surface: #181410; --raised: #211a13;
  --border: #28201a; --text: #e0d0bc; --sub: #887868; --btn: #b8a890;
  --bdb: #50402e; --acc: #b86030; font-family: 'IBM Plex Sans', sans-serif;
  background: var(--bg); color: var(--text); margin: 0; padding: 20px;
}
.container { max-width: 600px; margin: 0 auto; background: var(--surface); padding: 20px; border-radius: 8px; }
h1 { color: var(--acc); text-align: center; }
form { display: flex; flex-direction: column; gap: 15px; }
label { font-weight: 500; }
input, textarea, select { padding: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 4px; }
button { padding: 10px; background: var(--acc); color: white; border: none; border-radius: 4px; cursor: pointer; }
button:hover { background: var(--acd); }
.back { text-align: center; margin-top: 20px; }
.back a { color: var(--btn); text-decoration: none; }
.back a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
<h1>Feedback</h1>
<form id="feedbackForm">
<label for="rating">Rating (1-5):</label>
<select id="rating" required>
<option value="">Select rating</option>
<option value="1">1 - Poor</option>
<option value="2">2 - Fair</option>
<option value="3">3 - Good</option>
<option value="4">4 - Very Good</option>
<option value="5">5 - Excellent</option>
</select>
<label for="suggestions">Suggestions:</label>
<textarea id="suggestions" rows="5" placeholder="Tell us what you think..."></textarea>
<button type="submit">Submit Feedback</button>
</form>
<div class="back"><a href="/">Back to Collection</a></div>
</div>
<script>
document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const rating = parseInt(document.getElementById('rating').value);
  const suggestions = document.getElementById('suggestions').value;
  const response = await fetch('/api/feedback', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ rating, suggestions })
  });
  if (response.ok) {
    alert('Thank you for your feedback!');
    document.getElementById('feedbackForm').reset();
  } else {
    alert('Error submitting feedback.');
  }
});
</script>
</body>
</html>
